# Every push: a fresh install on Windows, Linux and Mac, then the server, the test suite,
# a backup and a stop. Uses its own folders (MARKOS_HOME), never anyone's real data.
name: install and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intel Mac here: GitHub's Apple-silicon Macs often can't take the job (capacity), so they
        # run weekly in mac-arm.yml, where a long queue can't turn every push red.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MARKOS_HOME: ${{ github.workspace }}/../markos-home
      MARKOS_SHORTCUT_DIR: ${{ github.workspace }}/../desktop
      MARKOS_BACKUP_DIR: ${{ github.workspace }}/../backups
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: doctor (Claude Code isn't on CI machines, so a warning is expected)
        run: node scripts/markos.mjs doctor || true
      - name: install
        timeout-minutes: 15
        run: node scripts/markos.mjs install
      - name: start and health check
        timeout-minutes: 5
        run: |
          node scripts/markos.mjs start
          node -e "fetch('http://localhost:3001/api/health').then(r=>r.json()).then(j=>{console.log(j);if(!j.ok)process.exit(1)})"
      - name: pages answer
        run: node -e "Promise.all(['/','/settings'].map(p=>fetch('http://localhost:3001'+p).then(r=>{console.log(p,r.status);if(r.status>=500)process.exit(1)}))).catch(e=>{console.error(e);process.exit(1)})"
      - name: backup
        run: node scripts/markos.mjs backup
      - name: night shift, end to end (fake AI, no plan used)
        timeout-minutes: 10
        env:
          MARKOS_FORCE_MODEL: fake:fake
        run: node scripts/markos.mjs night
      - name: night shift schedule (install, then remove)
        if: runner.os != 'macOS'
        run: |
          node scripts/markos.mjs night-shift
          node scripts/markos.mjs night-shift remove
      - name: shortcut exists
        shell: bash
        run: ls -la "$MARKOS_SHORTCUT_DIR"
      - name: stop
        run: node scripts/markos.mjs stop
      - name: tests
        timeout-minutes: 15
        run: npm test
      - name: logs on failure
        if: failure()
        shell: bash
        run: |
          for f in "$MARKOS_HOME"/logs/*.log "$MARKOS_HOME"/native/logs/*.log ~/Library/Logs/MarkOS/*.log; do [ -f "$f" ] && { echo "=== $f"; tail -60 "$f"; }; done; true
  one-line-install:
    name: one-line install (${{ matrix.os }}, ${{ matrix.how }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, how: download }
          - { os: windows-latest, how: download }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MARKOS_HOME: ${{ github.workspace }}/../oneline-home
      MARKOS_DIR: ${{ github.workspace }}/../oneline-markos
      MARKOS_SHORTCUT_DIR: ${{ github.workspace }}/../oneline-desktop
      MARKOS_REF: ${{ github.ref_name }}
      MARKOS_NO_GIT: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install with the one-liner (no git)
        if: runner.os != 'Windows'
        run: sh site/install.sh
      - name: install with the one-liner (no git)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-Content site/install.ps1 -Raw | Invoke-Expression
      - name: start and health check
        shell: bash
        run: |
          cd "$MARKOS_DIR"
          node scripts/markos.mjs start
          node -e "fetch('http://localhost:3001/api/health').then(r=>r.json()).then(j=>{console.log(j);if(!j.ok)process.exit(1)})"
          node scripts/markos.mjs stop
  no-claude-install:
    # The one-line install on a computer without Claude Code: the root install.sh (on a Mac it runs
    # scripts/install-mac.sh) must finish, say no AI is set up yet, and MarkOS must then start.
    name: install.sh without Claude Code (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MARKOS_HOME: ${{ github.workspace }}/../noclaude-home
      MARKOS_SHORTCUT_DIR: ${{ github.workspace }}/../noclaude-desktop
      MARKOS_APP: ${{ github.workspace }}/../noclaude-desktop/MarkOS.app
      MARKOS_BACKUP_DIR: ${{ github.workspace }}/../noclaude-backups
      MARKOS_NO_OPEN: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: no Claude Code anywhere MarkOS looks for it
        shell: bash
        run: |
          for c in "$(command -v claude || true)" ~/.local/bin/claude ~/.claude/local/claude /opt/homebrew/bin/claude /usr/local/bin/claude; do
            if [ -n "$c" ] && [ -e "$c" ]; then echo "Claude Code is at $c, but this job must run without it."; exit 1; fi
          done
      - name: sh install.sh
        timeout-minutes: 25
        shell: bash
        run: sh install.sh 2>&1 | tee "$RUNNER_TEMP/install.log"
      - name: it said no AI is set up yet
        shell: bash
        run: grep "No AI set up yet" "$RUNNER_TEMP/install.log"
      - name: the Desktop app and the night shift use the installer's Node (Mac)
        # They start from Finder or launchd with almost no environment, through scripts/lib-start.sh.
        # The runner also has a Node on lib-start.sh's fixed PATH, so this only passes if the Node
        # the installer saved wins: the same lookup that finds an nvm, fnm or volta Node.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          got=$(env -i HOME="$HOME" MARKOS_HOME="$MARKOS_HOME" REPO="$PWD" LOG="$RUNNER_TEMP/launcher-logs" /bin/zsh -c 'source scripts/lib-start.sh; print -r -- "$NODE"')
          want=$(node -p process.execPath)
          echo "lib-start.sh picked: $got"
          echo "the installer used:  $want"
          echo "also on the fixed PATH: $(ls /opt/homebrew/bin/node /usr/local/bin/node 2>/dev/null | tr '\n' ' ')"
          [ "$got" = "$want" ]
      - name: start and health check
        timeout-minutes: 10
        run: |
          node scripts/markos.mjs start
          node -e "fetch('http://localhost:3001/api/health').then(r=>r.json()).then(j=>{console.log(j);if(!j.ok)process.exit(1)})"
          node scripts/markos.mjs stop
      - name: logs on failure
        if: failure()
        shell: bash
        run: |
          for f in "$MARKOS_HOME"/logs/*.log "$MARKOS_HOME"/native/logs/*.log ~/Library/Logs/MarkOS/*.log; do [ -f "$f" ] && { echo "=== $f"; tail -60 "$f"; }; done; true
  local-ai:
    # A real model, not a stub: Ollama with a small model on the CI machine. MarkOS talks to it
    # through its own Ollama provider and through the OpenAI-compatible one (Ollama serves /v1 too).
    name: a real local model (Ollama)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MARKOS_LIVE_OLLAMA: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: install Ollama and pull a small model
        timeout-minutes: 10
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          curl -sf http://127.0.0.1:11434/api/tags >/dev/null || (nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$MARKOS_LIVE_OLLAMA"
      - name: MarkOS works with it
        timeout-minutes: 15
        run: npx vitest run tests/llm/live-local.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/live-local.json"
      - name: every live test ran (a skipped one would pass without proving anything)
        run: node -e "const r=require(process.argv[1]);const skipped=r.numPendingTests+r.numTodoTests;console.log(r.numPassedTests+' passed, '+skipped+' skipped');if(skipped>0||r.numPassedTests===0)process.exit(1)" "$RUNNER_TEMP/live-local.json"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx eslint
      - run: npx tsc --noEmit
